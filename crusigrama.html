<head>

<body>
<div class="app">

    <header>
        <h1>READ OR TRICK</h1>
    </header>

   <main>

    <section class="tablero">

       <div class="grid">

    <!-- 4. GOTHIC -->
    <div class="casilla pista"
         data-pista="4"
         style="top:0px; left:96px;">4</div>

    <div class="casilla"
         style="top:32px; left:96px;"></div>

    <div class="casilla"
         style="top:64px; left:96px;"></div>

    <!-- H compartida con HYDE -->
    <div class="casilla"
         style="top:96px; left:96px;"></div>

    <div class="casilla"
         style="top:128px; left:96px;"></div>

    <!-- C compartida con DRACULA -->
    <div class="casilla"
         style="top:160px; left:96px;"></div>


    <!-- 2. POE -->
    <div class="casilla pista"
         data-pista="2"
         style="top:32px; left:64px;">2</div>

    <!-- O compartida con GOTHIC -->
    <div class="casilla"
         style="top:32px; left:96px;"></div>

    <div class="casilla"
         style="top:32px; left:128px;"></div>


    <!-- 3. HYDE -->
    <!-- H compartida con GOTHIC -->
    <div class="casilla pista"
         data-pista="3"
         style="top:96px; left:96px;">3</div>

    <div class="casilla"
         style="top:96px; left:128px;"></div>

    <div class="casilla"
         style="top:96px; left:160px;"></div>

    <div class="casilla"
         style="top:96px; left:192px;"></div>


    <!-- 5. CARRIE -->
    <div class="casilla pista"
         data-pista="5"
         style="top:96px; left:32px;">5</div>

    <div class="casilla"
         style="top:128px; left:32px;"></div>

    <!-- R compartida con DRACULA -->
    <div class="casilla"
         style="top:160px; left:32px;"></div>

    <div class="casilla"
         style="top:192px; left:32px;"></div>

    <div class="casilla"
         style="top:224px; left:32px;"></div>

    <div class="casilla"
         style="top:256px; left:32px;"></div>


    <!-- 1. DRACULA -->
    <div class="casilla pista"
         data-pista="1"
         style="top:160px; left:0px;">1</div>

    <div class="casilla"
         style="top:160px; left:32px;"></div>

    <div class="casilla"
         style="top:160px; left:64px;"></div>

    <!-- C compartida con GOTHIC -->
    <div class="casilla"
         style="top:160px; left:96px;"></div>

    <div class="casilla"
         style="top:160px; left:128px;"></div>

    <!-- L compartida con LECTER -->
    <div class="casilla"
         style="top:160px; left:160px;"></div>

    <div class="casilla"
         style="top:160px; left:192px;"></div>


    <!-- 6. LECTER -->
    <!-- L compartida con DRACULA -->
    <div class="casilla pista"
         data-pista="6"
         style="top:160px; left:160px;">6</div>

    <div class="casilla"
         style="top:192px; left:160px;"></div>

    <div class="casilla"
         style="top:224px; left:160px;"></div>

    <div class="casilla"
         style="top:256px; left:160px;"></div>

    <!-- E compartida con RAVEN -->
    <div class="casilla"
         style="top:288px; left:160px;"></div>

    <div class="casilla"
         style="top:320px; left:160px;"></div>


    <!-- 7. RAVEN -->
    <div class="casilla pista"
         data-pista="7"
         style="top:288px; left:64px;">7</div>

    <div class="casilla"
         style="top:288px; left:96px;"></div>

    <div class="casilla"
         style="top:288px; left:128px;"></div>

    <!-- E compartida con LECTER -->
    <div class="casilla"
         style="top:288px; left:160px;"></div>

</div>

    </section>


    <!-- =========================
         CÍRCULO DE LETRAS
    ========================== -->

    <section class="letras">

        <div
            id="circuloLetras"
            class="circulo">
        </div>

    </section>

</main>

</div>

    <button id="cerrarPista">×</button>

    <h3 id="tituloPista">Pista</h3>

    </p>
